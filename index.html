<html lang="ta">
<head>
<meta charset="utf-8">

<title>அமிர்தம்</title>
<style>
:root{--hd:#17485A;--hd2:#1F4E5F;--bg:#F3F5F4;--card:#FFFFFF;--ink:#1D2A2E;--mut:#6B7A7E;--line:#E2E7E8;--good:#2E7D32;--bad:#C62828;--amb:#B26A00;--fn:#2E6FA8;--an:#C26B12;--chip:#EEF3F4;--pri:#17485A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Latha",system-ui,sans-serif;font-size:16px;line-height:1.45}
body.noscroll{overflow:hidden}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding:10px 16px 9px;padding-top:calc(10px + env(safe-area-inset-top))}
header .ttl{font-weight:700;font-size:17px}header .sub{font-size:13px;opacity:.85}
.sync{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.15)}
.sync.wait{background:#F2B33D;color:#3a2a00}.sync.off{background:#C62828}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--hd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#cfe0e4;font:inherit;font-size:11.5px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:19px}nav button.on{color:#fff;font-weight:700;box-shadow:inset 0 3px 0 #F2B33D}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.lab{font-size:12.5px;color:var(--mut)}.mut{color:var(--mut)}.sm{font-size:13px}.c{text-align:center}.r{text-align:right}.mt{margin-top:12px}
.good{color:var(--good)}.bad{color:var(--bad)}.good-bg{background:#E6F4E8}.bad-bg{background:#FDECEA}
.big{font-size:26px;font-weight:700;line-height:1.2}
.row2{display:flex;gap:10px;align-items:center;justify-content:space-between}.row2>label{flex:1}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
.row3.c>div{text-align:center}
.seg{display:flex;background:#DDE5E7;border-radius:12px;padding:3px;margin:4px 0 2px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:9px 4px;border-radius:9px;color:#3b4b50}
.seg button.on{background:#fff;color:var(--hd);box-shadow:0 1px 2px rgba(0,0,0,.1)}.seg button.on.FN{color:var(--fn)}.seg button.on.AN{color:var(--an)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--hd);font:inherit;font-weight:600;border-radius:11px;padding:10px 14px;text-decoration:none;cursor:pointer}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:9px}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.ghost{background:transparent}
.btn.wide{display:flex;width:100%;margin:10px 0}.btn.xl{font-size:19px;padding:15px}
.btn.ok{background:#E6F4E8;border-color:#BFE0C3;color:var(--good)}.btn.warn{background:#FFF3E0;border-color:#F3D2A0;color:var(--amb)}
.btn.milk{width:100%;padding:10px 6px;font-size:14px}.btn.milk.done{background:#E6F4E8;color:var(--good);border-color:#BFE0C3}
.btn.veh{display:flex;flex-direction:column;width:100%;margin-top:10px}.btn.veh small{font-weight:400;font-size:12px;color:var(--mut)}
.btn.veh.yes{background:#E6F4E8;color:#1B5E20;border-color:#BFE0C3}.btn.veh.no{background:#FDECEA;color:#B71C1C;border-color:#F3C1BD}
.acts{display:flex;flex-direction:column;gap:8px}.acts .btn{width:100%}
input,select{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid #CBD5D8;border-radius:10px;background:#fff;color:var(--ink)}
input#have{font-size:22px;font-weight:700;text-align:center;background:#FFF8D9;border-color:#E6CF73;color:#1d3fa8}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 0}label input,label select{margin-top:3px;color:var(--ink)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}label.chk input{width:auto}
select.wide{margin:8px 0}
.stat{margin:10px 0 2px;font-weight:600}
.covers{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--hd2);border-radius:10px;overflow:hidden;margin-top:8px}
.covers div{text-align:center;padding:4px 0}.covers div+div{border-left:1px solid var(--line)}.covers span{display:block;font-size:12px;color:var(--mut);background:#EEF2F3}.covers b{font-size:24px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;text-align:left;padding:10px 2px;color:var(--ink)}
.li:last-child{border-bottom:0}
.rt{min-width:30px;height:30px;border-radius:15px;background:#E7EEF0;color:var(--hd);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.rt.FN{background:#E3EEF8;color:var(--fn)}.rt.AN{background:#FBEBDA;color:var(--an)}
.nm{flex:1;min-width:0}.nm small{display:block;color:var(--mut);font-size:12.5px}
.qv{font-weight:700;font-size:18px}.qv.z{color:var(--bad)}
.tag{font-style:normal;font-size:11.5px;padding:1px 7px;border-radius:9px;background:#EEF2F3;color:#455}
.tag.r{background:#FDECEA;color:var(--bad)}.tag.a{background:#FFF3E0;color:var(--amb)}.tag.g{background:#E6F4E8;color:var(--good)}.tag.b{background:#E3EEF8;color:var(--fn)}.tag.n{background:#EEF2F3;color:#566}
.note{background:#FFF8E1;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.sg{border:2px solid #F2B33D}.sg-hd{font-weight:700}
.sgr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.sgr select{width:84px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid #CBD5D8;background:var(--chip);border-radius:18px;padding:7px 12px;font:inherit;font-size:14px;color:var(--ink)}
.chip.on{background:var(--hd);border-color:var(--hd);color:#fff}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:6px 0}.sum div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wh{text-align:center;font-size:12px;color:var(--mut)}
.cd{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 0;font:inherit;display:flex;flex-direction:column;align-items:center;min-height:46px}
.cd span{font-size:11px;color:var(--mut)}.cd b{font-size:15px}.cd.wo{background:#EDEDED}.cd.ed{background:#FFF3B0}.cd.td{border:2px solid var(--hd)}.cd.fu b{color:#8aa}
.stop{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px 0}.stop .bt{display:flex;gap:6px}
.stop .cv{font-size:15px;font-weight:700;color:var(--hd)}.stop.ok{opacity:.55}.stop.ok .nm b::after{content:" ✓";color:var(--good)}.stop.iss .nm b::after{content:" ⚠";color:var(--amb)}
pre.msg{white-space:pre-wrap;font:inherit;font-size:14px;background:#F6F8F8;border-radius:10px;padding:10px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,25,30,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}.sh-in{background:#fff;width:100%;max-width:720px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sh-hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sh-hd .x{border:0;background:#EEF2F3;border-radius:16px;width:32px;height:32px;font-size:16px}
.sh-bd{padding:6px 16px 22px;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#22343A;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:30;max-width:90%;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.bad{background:var(--bad)}
.hbtn{display:flex;gap:6px;align-items:center}
.li .lim{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:none;font:inherit;text-align:left;padding:0;color:var(--ink)}
.cal-b{flex:none}
.sw{width:52px;height:30px;border-radius:15px;border:0;background:#C9D3D6;position:relative;flex:none}
.sw i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--good)}.sw.on i{left:25px}
.ord .orow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.ord .orow.moved{background:#FFF8D9}
input.wide{margin:8px 0}
.map{height:340px;border-radius:10px;margin:8px 0;z-index:0}
.leaflet-tooltip.mk{background:none;border:0;box-shadow:none;color:#fff;font-weight:700;font-size:12px;padding:0}
.leaflet-tooltip.mk::before{display:none}
.card.alert{background:#FDECEA;border:2px solid var(--bad)}
.login{max-width:420px;margin:12vh auto 0;padding:20px;text-align:center}.login .logo{font-size:56px}.login h1{margin:4px 0;color:var(--hd)}
nav.n8 button{font-size:9.6px;letter-spacing:-.3px;padding:6px 0 7px}nav.n8 button span{font-size:17px}
.li .ic{font-size:20px;width:28px;text-align:center;flex:none}
.tgrid .tbtn span{display:block}
nav.n7 button{font-size:10.5px;letter-spacing:-.2px}nav.n7 button span{font-size:18px}
.lockb{position:absolute;right:62px;top:calc(9px + env(safe-area-inset-top));border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:3px 8px;font-size:15px}
.seg.sm button{font-size:12.5px;padding:8px 2px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}.tgrid.big{grid-template-columns:1fr 1fr}
.tbtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;font:inherit;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tbtn span{font-size:24px}.tgrid.big .tbtn{font-size:16px;font-weight:700;min-height:84px}.tgrid.big .tbtn span{font-size:30px}
input.amt{font-size:26px;font-weight:700;text-align:center;margin-top:8px;background:#FFFDF2}
.chip.add{background:#fff;border-style:dashed;color:var(--hd)}
.li.rec .ic{font-size:20px;width:28px;text-align:center}.li.rec .qv{font-size:15px;white-space:nowrap}
.barrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13.5px;margin:6px 0}.barrow .bt{grid-column:1/3;height:6px;background:#EEF2F3;border-radius:3px;overflow:hidden}
.barrow .bt i{display:block;height:100%}.barrow .bt i.bad{background:#E57373}.barrow .bt i.good{background:#66BB6A}
details.card>summary{list-style:none;cursor:pointer;border-bottom:0}details.card>summary::-webkit-details-marker{display:none}
.loanc{display:block;width:100%;text-align:left;border:0;font:inherit;color:var(--ink)}
.sprow{border-top:1px dashed var(--line);margin-top:8px}
#lock{position:fixed;inset:0;z-index:50;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:center}
#lock .lk-in{width:100%;max-width:340px;text-align:center;padding:20px}#lock .logo{font-size:44px}#lock h2{margin:4px 0 8px}#lock .mut{color:#cfe0e4}
#lock .dots{display:flex;gap:14px;justify-content:center;margin:18px 0}#lock .dots i{width:14px;height:14px;border-radius:7px;border:2px solid #fff}#lock .dots i.f{background:#fff}
#lock .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}#lock .pad button{border:0;border-radius:36px;height:64px;font-size:24px;background:rgba(255,255,255,.14);color:#fff}
#lock .btn{margin-top:18px;color:var(--hd)}
/* app-0.7/0.8: 5 tab · சிறு tab · ＋ · பணிகள் v2 · டைரி · மாத grid */
nav.n5 button{font-size:12px}nav.n5 button span{font-size:20px}
.clk{position:absolute;right:14px;bottom:8px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px;color:#fff;opacity:.95}
.subt{display:flex;gap:6px;overflow-x:auto;margin:6px -12px 2px;padding:2px 12px 6px;scrollbar-width:none}.subt::-webkit-scrollbar{display:none}
.subt button{flex:none;border:1px solid #CBD5D8;background:#fff;border-radius:18px;padding:7px 13px;font:inherit;font-size:14px;font-weight:600;color:#3b4b50;white-space:nowrap}
.subt button.on{background:var(--hd);border-color:var(--hd);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:28px;border:0;background:#F2B33D;color:#3a2a00;font-size:30px;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.sosb{position:fixed;left:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:7;border:2px solid var(--bad);background:#fff;color:var(--bad);border-radius:22px;padding:8px 14px;font:inherit;font-weight:700;font-size:13.5px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
@media(min-width:760px){.fab{right:calc(50% - 344px)}.sosb{left:calc(50% - 344px)}}
.msum,.tsum{margin-top:4px}
/* பணிகள் — காலைச் சுருக்கம் */
.brief{background:linear-gradient(135deg,#17485A,#246679);color:#fff;border-radius:18px;padding:14px;margin:6px 0 10px}
.brief .lab{color:#cfe0e4}.brief .greet{font-size:20px;font-weight:700;margin:2px 0}.brief .sm{opacity:.92}
.brief.small{padding:10px 14px}.brief.small .greet{font-size:16px}
.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}.kpi4.k3{grid-template-columns:repeat(3,1fr)}
.kpi4 div{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kpi4 b{display:block;font-size:19px}.kpi4 span{font-size:11px;color:var(--mut);line-height:1.25;display:block}
.nowc{background:#E3EEF8}.nowc b{color:#1c4670}
.big3 .it{display:flex;gap:10px;align-items:center;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;text-align:left;width:100%;color:var(--ink)}.big3 .it:last-child{border-bottom:0}
.big3 .n{width:26px;height:26px;border-radius:13px;background:#F2B33D;color:#3a2a00;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}.big3 .n.o{background:#EEF2F3;color:#999}
.big3 .nm small{display:block;color:var(--mut);font-size:12.5px}
.dele{background:#FFF8E1;font-size:14px}
.sosc{background:#FDECEA;border:2px solid var(--bad)}.sosc .btn{margin-top:6px}
.nightb{background:#0F2A35;color:#fff;border-color:#0F2A35}
.btn.l{justify-content:space-between;background:#fff}
.oldm{align-items:center}.oldm .lab{margin-right:4px}
/* வரிகள் */
.tl{padding:2px 10px}.trow{display:flex;align-items:stretch;gap:8px;border-bottom:1px solid var(--line)}.trow:last-child{border-bottom:0}
.trow .tck{flex:none;width:34px;height:34px;margin:9px 0;border-radius:17px;border:2px solid #9DB0B5;background:#fff;font:inherit;font-size:17px;font-weight:700;color:var(--good);display:flex;align-items:center;justify-content:center}
.trow .tck.nav{border-style:dashed;color:var(--hd)}.trow.done .tck{background:#E6F4E8;border-color:#7CC283}.trow .tck.auto,.trow.done .tck.auto{background:#E3EEF8;border-color:#8DB3D6;color:var(--fn)}
.trow .tbd{flex:1;min-width:0;display:flex;gap:8px;align-items:center;border:0;background:none;font:inherit;text-align:left;padding:9px 0;color:var(--ink)}
.trow .tt{flex:none;width:44px;font-size:13px;font-weight:700;color:var(--hd);text-align:center}
.trow .nm b{font-weight:600}.trow.done .nm b{text-decoration:line-through;color:var(--mut)}.trow.star .tck{border-color:#F2B33D}
.trow.over .tt{color:var(--bad)}
.trow.ev{background:#EEF4FB;margin:4px -10px;padding:0 10px;border-left:4px solid var(--fn)}.trow.ev .tt{align-self:center;line-height:1.2}
.btn.bad{color:var(--bad)}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;background:#EEF2F3;color:#455;white-space:nowrap}.pill.a{background:#FFF3E0;color:var(--amb)}.pill.r{background:#FDECEA;color:var(--bad)}
/* டைரி */
.dnav{display:flex;justify-content:space-between;gap:6px;margin:0 0 8px}.dnav .btn{flex:1}
.diary{border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12);margin-bottom:10px;background:#FBF6EA}
.dhead{background:#FBF6EA;border-bottom:2px solid #C9B98F;padding:10px 14px 8px;display:flex;align-items:flex-end;gap:12px}

.blk,.tlb{position:absolute;left:46px;right:calc(38% + 4px);border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600;overflow:hidden;line-height:1.3}
.blk.c1,.tlb.c1,.tline .tlb.c1{left:58px;right:auto;width:calc(62% - 70px);z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.blk small,.tlb small{display:block;font-weight:400;font-size:11px;opacity:.85}
.b-farm{background:rgba(76,140,74,.2);border-left:4px solid #4C8C4A;color:#24521f}
.b-clin{background:rgba(46,111,168,.15);border-left:4px solid var(--fn);color:#1c4670}
.b-milk{background:rgba(242,179,61,.3);border-left:4px solid #D99A1E;color:#5b3d00}
.b-me{background:rgba(255,255,255,.85);border:1.5px dashed #B9A77A;color:#3d3220}
.pin{position:absolute;left:auto;right:6px;width:36%;border:0;border-radius:8px;padding:3px 6px;font:inherit;font-size:11.5px;font-weight:600;text-align:left;background:#fff;color:#2c3e75;box-shadow:0 1px 2px rgba(0,0,0,.15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}

.hand{padding:6px 14px 10px;background:#FBF6EA}.hand button{display:block;border:0;background:none;font:inherit;font-size:14px;color:#2c3e75;padding:4px 0;text-align:left;transform:rotate(-1deg)}

.tline .tlb{left:48px}.tline .pin{right:6px}
.wk{display:flex;flex-direction:column;gap:6px}
.wkd{display:flex;gap:10px;border:1px solid #E8DCC0;background:#FBF6EA;border-radius:12px;padding:8px 10px;font:inherit;text-align:left;color:#3d3220}
.wkd.td{outline:2px solid #A3271B}.wkd.su .wn b{color:#A3271B}
.wkd .wn{width:40px;flex:none;text-align:center;font-size:12px;color:#6b5a3a}.wkd .wn b{display:block;font-family:Georgia,serif;font-size:22px;color:#3d3220}
.wkd .wl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.wkd .wl i{font-style:normal;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtitle{text-align:center;font-family:Georgia,serif;font-size:20px;font-weight:800;color:#A3271B;margin:2px 0 6px}
.mgr{display:grid;grid-template-columns:repeat(7,1fr);background:#FBF6EA;border:1px solid #C9B98F}
.mgr>*{min-height:70px;border:0;border-right:1px solid #E8DCC0;border-bottom:1px solid #E8DCC0;padding:3px;font:inherit;font-size:10.5px;text-align:left;background:none;display:flex;flex-direction:column;overflow:hidden;color:#3d3220}
.mgr>*:nth-child(7n){border-right:0}.mgr .wh{min-height:24px;text-align:center;font-weight:700;color:#6b5a3a;background:#F3E9CF;align-items:center;justify-content:center;font-size:11px}
.mgr b{font-family:Georgia,serif;font-size:14px}.mgr .su b{color:#A3271B}.mgr .td{background:#FFF0B8;outline:2px solid #A3271B;outline-offset:-2px}
.mgr .ic{display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paperc{background:#FBF6EA;margin-top:8px}
/* பட்டியல் */
.mx{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 10px}
.mx button{border:0;border-radius:12px;padding:8px;min-height:88px;font:inherit;font-size:12.5px;text-align:left;color:var(--ink);vertical-align:top;display:block}
.mx button.on{outline:2px solid var(--hd)}.mx b{display:block;font-size:13px;margin-bottom:3px}.mx .fnc{color:var(--fn)}
/* வாரம் */
.spark{display:flex;align-items:flex-end;gap:5px;height:70px;margin-top:6px}.spark i{flex:1;background:#8DB3D6;border-radius:3px 3px 0 0;min-height:2px}.spark i.hi{background:var(--hd)}
.sparkl{display:flex;justify-content:space-between}.sparkl span{flex:1;text-align:center}
.barrow2{margin:6px 0}.bar{height:8px;background:#EEF2F3;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#4C8C4A;max-width:100%}
/* இரவு */
.night{background:linear-gradient(180deg,#0F2A35,#17485A);color:#fff;border-radius:18px;padding:14px 12px;margin-top:6px}
.night .nt{font-size:19px;font-weight:800}.night .ns{font-size:12.5px;color:#9fb9c1;margin-bottom:8px}
.night .card{background:rgba(255,255,255,.08);color:#fff;box-shadow:none}.night .lab,.night .mut{color:#9fb9c1}
.night .row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px}.night .row:last-child{border:0}
.night .row .r{margin-left:auto;font-size:12.5px;color:#cfe0e4}
.ck2{width:22px;height:22px;border-radius:11px;border:2px solid #9DB0B5;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--good);background:transparent}
.ck2.on{background:#E6F4E8;border-color:#7CC283}.ck2.auto{background:#E3EEF8;border-color:#8DB3D6;color:var(--fn)}
.goldb{background:#F2B33D;color:#3a2a00;border-color:#F2B33D}
.night .btn.ghost{color:#cfe0e4;border-color:rgba(255,255,255,.25);margin-top:8px}
.rowc{padding:6px 0;border-bottom:1px solid var(--line)}
.aut{border-top:1px solid var(--line);padding:8px 0}
.inp input{font-size:17px;padding:12px;border:1.5px solid var(--hd)}
.sosgo{background:var(--bad);color:#fff;border-color:var(--bad)}
/* மாத grid */
.mgw{padding:6px 0;overflow:hidden}.mgs{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.mg{border-collapse:separate;border-spacing:0;font-size:13px}
.mg th,.mg td{border-bottom:1px solid var(--line);border-right:1px solid #EEF2F3;padding:0;text-align:center;min-width:30px;height:32px;white-space:nowrap}
.mg thead th{font-size:12px;font-weight:700;color:var(--hd);background:#F6F8F8;line-height:1.1}.mg thead th small{display:block;font-weight:400;color:var(--mut);font-size:10px}
.mg thead th.sun{background:#ECEFF0}.mg th.td{background:#FFF3B0}
.mg tbody th,.mg thead th:first-child,.mg tfoot th{position:sticky;left:0;z-index:1;background:#fff;text-align:left;font-weight:600;min-width:118px;max-width:118px;overflow:hidden;text-overflow:ellipsis;padding:0 6px 0 4px;box-shadow:1px 0 0 var(--line)}
.mg tbody th .rt{min-width:22px;height:22px;font-size:11.5px;margin-right:4px}
.mg td.wo{background:#EDEDED}.mg td.ed{background:#FFF3B0}.mg td.fu{color:#9AACB0}.mg td.td{outline:2px solid var(--hd);outline-offset:-2px}.mg td.z{color:var(--bad)}
.mg tr.left th{color:var(--mut)}.mg td.sm-t,.mg tfoot td{font-weight:700;background:#F6F8F8}.mg tfoot th{background:#F6F8F8}
.row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border-bottom:0}.row .r{margin-left:auto;font-size:12.5px;color:var(--mut);white-space:nowrap}
/* ═══ app-0.9 ஒருமித்த வடிவம்: சிறு tab (எல்லாப் பிரிவும்) · பொத்தான் · எழுத்து வெட்டப்படாமல் ═══ */
.btn{text-align:center;line-height:1.3}
button{line-height:1.35}
.subt,.seg.sm{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;overflow:visible;margin:6px 0 10px;padding:4px;background:#DDE5E7;border-radius:14px}
.subt:has(> :nth-child(6)){grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.subt button,.seg.sm button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:52px;padding:5px 2px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:#3b4b50;white-space:normal;text-align:center;line-height:1.25;box-shadow:none}
.subt:has(> :nth-child(6)) button{min-height:44px;flex-direction:row;gap:6px}
.subt button.on,.seg.sm button.on{background:#fff;color:var(--hd);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.subt button .si,.seg.sm button .si{font-size:18px;line-height:1.2}
.seg.sm.plain button,.seg.sm.two button{min-height:40px}
.kpi4 button{border:0;font:inherit;color:inherit;background:#fff;border-radius:12px;padding:8px 4px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.mgr .ic{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pin{white-space:normal;line-height:1.25;max-height:40px}
.pinchk{margin:0 0 8px;font-size:13.5px}
.pkrow input{text-align:center;font-weight:700}
.tbtn{text-align:center;line-height:1.3}
.li .nm,.trow .nm{line-height:1.35}
.chip{line-height:1.3}
/* முதல் திறப்பு — உடனே தெரியும் திரை */
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#17485A;color:#fff;gap:10px;z-index:100}
#boot .bl{font-size:52px}#boot .bt{font-size:22px;font-weight:800;letter-spacing:.5px}#boot .bs{font-size:13px;opacity:.8}
#boot .bar{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}#boot .bar i{display:block;height:100%;width:40%;background:#F2B33D;animation:bt 1s ease-in-out infinite alternate}

.row2>label,.row3>label,.row2>div,.row3>div{min-width:0}input,select{min-width:0;max-width:100%}input[type=date],input[type=time]{min-height:42px}
